  <text x="365" y="125" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">AUGUST 2026</text>
  <line x1="30" y1="133" x2="370" y2="133" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <circle cx="200" cy="260" r="110" fill="url(#c13-lamp)"/>
  
  <!-- Silhouette Portrait &amp; Pipe Motif (Habib Tanvir iconic look) -->
  <g transform="translate(140, 180)">
    <!-- Spectacles &amp; Profile outline -->
    <circle cx="45" cy="55" r="18" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="78" cy="55" r="18" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="63" y1="55" x2="60" y2="55" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Shawl draping -->
    <path d="M10,95 Q60,80 110,95 L120,150 L0,150 Z" fill="#37474F" opacity="0.85"/>
    <path d="M25,100 Q60,115 95,100" stroke="#FFE082" stroke-width="2" fill="none"/>
    <!-- Iconic bamboo curtain lines -->
    <line x1="-30" y1="20" x2="-30" y2="160" stroke="#90CAF9" stroke-width="2" opacity="0.4"/>
    <line x1="-15" y1="0" x2="-15" y2="160" stroke="#90CAF9" stroke-width="2" opacity="0.4"/>
    <line x1="135" y1="0" x2="135" y2="160" stroke="#90CAF9" stroke-width="2" opacity="0.4"/>
    <line x1="150" y1="20" x2="150" y2="160" stroke="#90CAF9" stroke-width="2" opacity="0.4"/>
  </g>

  <g transform="translate(30, 360)">
