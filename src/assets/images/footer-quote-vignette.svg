<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="vignetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBE6"/>
      <stop offset="100%" stop-color="#FEF7E0"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#D9381E"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBC04" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF4500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Box with Rounded Pill and Border -->
  <rect x="5" y="5" width="310" height="210" rx="24" fill="url(#vignetteGrad)" stroke="#FF4500" stroke-width="2"/>
  <rect x="10" y="10" width="300" height="200" rx="20" fill="none" stroke="#FBBC04" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Warm Diya / Lamp Glow -->
  <circle cx="160" cy="115" r="90" fill="url(#lampGlow)"/>

  <!-- Central Theatrical Nacha Mask (Artistic Silhouette) -->
  <g transform="translate(160, 85)">
    <!-- Mask Halo -->
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#FF4500" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="#FFF5F2"/>
    
    <!-- Stylized Mask Face -->
    <path d="M -24,-14 C -22,-32 22,-32 24,-14 C 28,14 0,38 0,38 C 0,38 -28,14 -24,-14 Z" fill="url(#terracotta)"/>
    
    <!-- Intricate Mask Features -->
    <ellipse cx="-10" cy="-4" rx="4.5" ry="3" fill="#FFFFFF"/>
    <ellipse cx="10" cy="-4" rx="4.5" ry="3" fill="#FFFFFF"/>
    <circle cx="-10" cy="-4" r="2" fill="#202124"/>
    <circle cx="10" cy="-4" r="2" fill="#202124"/>
    
    <!-- Smile &amp; Traditional Tilak -->
    <path d="M -12,12 Q 0,22 12,12" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <polygon points="0,-24 -4,-12 4,-12" fill="#FBBC04"/>
    
    <!-- Traditional Sunburst Crown / Pagdi -->
    <path d="M -22,-24 Q 0,-38 22,-24" fill="none" stroke="#FBBC04" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="-28" r="2.5" fill="#FF4500"/>
    <circle cx="0" cy="-38" r="3.5" fill="#FF4500"/>
    <circle cx="20" cy="-28" r="2.5" fill="#FF4500"/>
  </g>

  <!-- Mandar Folk Drum resting below Mask -->
  <g transform="translate(160, 165)">
    <!-- Shadow -->
    <ellipse cx="0" cy="18" rx="55" ry="8" fill="#D9381E" opacity="0.2"/>
    <!-- Drum Body -->
    <path d="M -50,-12 Q 0,-18 50,-12 Q 54,12 50,14 Q 0,20 -50,14 Q -54,-10 -50,-12 Z" fill="#8C2500" stroke="#FF4500" stroke-width="1.5"/>
    <!-- Left Leather Head -->
    <ellipse cx="-50" cy="1" rx="6" ry="13" fill="#FBBC04" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="-50" cy="1" rx="2.5" ry="6" fill="#422006"/>
    <!-- Right Leather Head -->
    <ellipse cx="50" cy="1" rx="6" ry="13" fill="#FBBC04" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="50" cy="1" rx="2.5" ry="6" fill="#422006"/>
    <!-- Leather Tuning Straps (V-Pattern) -->
    <path d="M -48,-11 L -25,18 L 0,-16 L 25,18 L 48,-11" fill="none" stroke="#FEF7E0" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Traditional Brass Diya / Terracotta Lamp (Bottom Left) -->
  <g transform="translate(48, 170)">
    <path d="M -16,8 Q 0,16 16,8 Q 20,2 14,0 Q 0,0 -14,0 Q -20,2 -16,8 Z" fill="#D97706"/>
    <!-- Flame -->
    <path d="M 0,0 Q -4,-12 0,-18 Q 4,-12 0,0 Z" fill="#FF4500"/>
    <path d="M 0,-2 Q -2,-10 0,-14 Q 2,-10 0,-2 Z" fill="#FBBC04"/>
  </g>

  <!-- Traditional Brass Diya / Terracotta Lamp (Bottom Right) -->
  <g transform="translate(272, 170)">
    <path d="M -16,8 Q 0,16 16,8 Q 20,2 14,0 Q 0,0 -14,0 Q -20,2 -16,8 Z" fill="#D97706"/>
    <!-- Flame -->
    <path d="M 0,0 Q -4,-12 0,-18 Q 4,-12 0,0 Z" fill="#FF4500"/>
    <path d="M 0,-2 Q -2,-10 0,-14 Q 2,-10 0,-2 Z" fill="#FBBC04"/>
  </g>

  <!-- Sparkles &amp; Bell Motifs -->
  <circle cx="50" cy="50" r="3" fill="#FF4500"/>
  <circle cx="270" cy="50" r="3" fill="#FF4500"/>
  <path d="M 45,40 L 55,40 M 50,35 L 50,45" stroke="#FBBC04" stroke-width="1.5"/>
  <path d="M 265,40 L 275,40 M 270,35 L 270,45" stroke="#FBBC04" stroke-width="1.5"/>
</svg>
