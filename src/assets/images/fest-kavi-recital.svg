<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1726"/>
      <stop offset="50%" stop-color="#2A223B"/>
      <stop offset="100%" stop-color="#3D2938"/>
    </linearGradient>
    <radialGradient id="kr-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFD180" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFAB40" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1B1726" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#kr-bg)"/>

  <!-- Warm Reading Lamp / Lantern Glow -->
  <circle cx="360" cy="200" r="160" fill="url(#kr-glow)"/>

  <!-- Traditional Shamiana Canopy Drapery -->
  <path d="M0,0 Q200,60 400,30 Q600,60 800,0 L800,40 Q600,90 400,60 Q200,90 0,40 Z" fill="#9C27B0" opacity="0.6"/>
  <path d="M0,20 Q200,80 400,50 Q600,80 800,20 L800,35 Q600,90 400,60 Q200,90 0,35 Z" fill="#FFC107" opacity="0.75"/>

  <!-- Poet at Rostrum / Low Table (Chouki) -->
  <g transform="translate(360, 220)">
    <!-- Low Baithak Table / Chauki with carpet -->
    <rect x="-140" y="60" width="280" height="20" rx="3" fill="#5D4037" stroke="#FFD180" stroke-width="1.5"/>
    <rect x="-160" y="78" width="320" height="12" fill="#D32F2F"/><!-- Kashmiri runner -->
    
    <!-- Vintage Ribbon Microphone on Chrome Stand -->
    <line x1="-30" y1="60" x2="-30" y2="0" stroke="#CFD8DC" stroke-width="4"/>
    <ellipse cx="-30" cy="-10" rx="10" ry="16" fill="#90A4AE" stroke="#ECEFF1" stroke-width="2"/>
    <line x1="-30" y1="-26" x2="-30" y2="6" stroke="#37474F" stroke-width="2"/>
    
    <!-- Poet Silhouette Reading Scroll -->
    <circle cx="45" cy="-25" r="14" fill="#FFE082"/>
    <path d="M30,-10 L60,-10 L75,60 L15,60 Z" fill="#F5F5F5"/>
    <!-- Nehru jacket -->
    <path d="M33,-8 L57,-8 L60,40 L30,40 Z" fill="#1A237E"/>
    <!-- Open parchment / diary held in hands -->
    <polygon points="10,15 25,5 30,25 15,35" fill="#FFFDE7" stroke="#BCAAA4"/>
    <polygon points="-5,12 10,15 15,35 0,32" fill="#FFF8E1" stroke="#BCAAA4"/>
  </g>

  <!-- Listening Dignitaries in Baithak (Cross-legged cushions) -->
  <g transform="translate(140, 290)">
    <ellipse cx="0" cy="10" rx="35" ry="12" fill="#E65100"/>
    <circle cx="0" cy="-20" r="11" fill="#FFCC80"/>
    <path d="M-12,-8 L12,-8 L18,20 L-18,20 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(620, 290)">
    <ellipse cx="0" cy="10" rx="35" ry="12" fill="#1565C0"/>
    <circle cx="0" cy="-20" r="11" fill="#FFCC80"/>
    <path d="M-12,-8 L12,-8 L18,20 L-18,20 Z" fill="#FFFFFF"/>
  </g>

  <!-- Foreground Floor Cushions (Gaav-Takkiya) -->
  <rect x="0" y="370" width="800" height="80" fill="#140F1D"/>
  <ellipse cx="100" cy="380" rx="45" ry="16" fill="#C2185B"/>
  <ellipse cx="700" cy="380" rx="45" ry="16" fill="#00897B"/>

  <!-- Badges -->
  <g transform="translate(30, 30)">
    <rect width="210" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="22" cy="20" r="6" fill="#AB47BC"/>
    <text x="36" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">KAVITA UTSAV POETRY RECITAL</text>
  </g>
  <g transform="translate(590, 30)">
    <rect width="180" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFE082">40+ VOICES &amp; FLUTE</text>
  </g>
</svg>