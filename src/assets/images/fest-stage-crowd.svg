<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="60%" stop-color="#191F38"/>
      <stop offset="100%" stop-color="#34222E"/>
    </linearGradient>
    <radialGradient id="sc-spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FF7043" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#191F38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sc-beam-left" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc-beam-right" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1A73E8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sc-sky)"/>
  
  <!-- Spotlight Beams -->
  <polygon points="120,0 200,0 480,320 360,320" fill="url(#sc-beam-left)"/>
  <polygon points="680,0 600,0 320,320 440,320" fill="url(#sc-beam-right)"/>
  
  <!-- Stage Warm Core Glow -->
  <ellipse cx="400" cy="270" rx="300" ry="90" fill="url(#sc-spotlight)"/>
  
  <!-- Jashpur Open Air Stage Architectural Arches -->
  <path d="M220,300 C220,180 300,160 400,160 C500,160 580,180 580,300" fill="none" stroke="#FFB74D" stroke-width="4" opacity="0.7"/>
  <path d="M250,300 C250,200 315,185 400,185 C485,185 550,200 550,300" fill="none" stroke="#FFD54F" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Actors on Stage Silhouettes -->
  <g transform="translate(400, 260)">
    <!-- Central Hero with staff / dialogue gesture -->
    <circle cx="0" cy="-35" r="9" fill="#FFFFFF"/>
    <path d="M-10,-24 L10,-24 L16,15 L-16,15 Z" fill="#FFFFFF"/>
    <line x1="-12" y1="-15" x2="-26" y2="-45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="15" x2="20" y2="-55" stroke="#FFE082" stroke-width="3"/>
    
    <!-- Left Supporting Actor (sitting in contemplation) -->
    <circle cx="-55" cy="-20" r="7" fill="#FFCC80"/>
    <path d="M-65,-12 L-45,-12 L-40,15 L-70,15 Z" fill="#FFCC80"/>
    
    <!-- Right Supporting Actor (arms open in exclamation) -->
    <circle cx="55" cy="-32" r="8" fill="#FFAB91"/>
    <path d="M47,-22 L63,-22 L68,15 L42,15 Z" fill="#FFAB91"/>
    <line x1="45" y1="-16" x2="30" y2="-38" stroke="#FFAB91" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="65" y1="-16" x2="80" y2="-38" stroke="#FFAB91" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stage Platform Border -->
  <rect x="150" y="280" width="500" height="24" rx="3" fill="#2E1C14" stroke="#FF9800" stroke-width="1.5"/>

  <!-- Festive Torches / Mashals Left &amp; Right -->
  <g transform="translate(180, 240)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#8D6E63" stroke-width="4"/>
    <ellipse cx="0" cy="-6" rx="8" ry="14" fill="#FF5722"/>
    <ellipse cx="0" cy="-6" rx="4" ry="9" fill="#FFEB3B"/>
  </g>
  <g transform="translate(620, 240)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#8D6E63" stroke-width="4"/>
    <ellipse cx="0" cy="-6" rx="8" ry="14" fill="#FF5722"/>
    <ellipse cx="0" cy="-6" rx="4" ry="9" fill="#FFEB3B"/>
  </g>

  <!-- Audience Silhouettes Rows in Foreground (Amphitheatre Crowd) -->
  <!-- Row 1: Back Audience (Smaller) -->
  <g fill="#151928" opacity="0.85">
    <circle cx="100" cy="340" r="14"/><circle cx="140" cy="336" r="15"/><circle cx="180" cy="342" r="14"/>
    <circle cx="220" cy="338" r="16"/><circle cx="260" cy="335" r="15"/><circle cx="300" cy="340" r="14"/>
    <circle cx="500" cy="338" r="15"/><circle cx="540" cy="335" r="16"/><circle cx="580" cy="342" r="14"/>
    <circle cx="620" cy="336" r="15"/><circle cx="660" cy="340" r="14"/><circle cx="700" cy="337" r="15"/>
  </g>
  <!-- Row 2: Mid Foreground -->
  <g fill="#0D111A">
    <circle cx="70" cy="380" r="22"/><circle cx="130" cy="375" r="24"/><circle cx="190" cy="382" r="22"/>
    <circle cx="250" cy="378" r="25"/><circle cx="320" cy="385" r="23"/><circle cx="480" cy="382" r="24"/>
    <circle cx="550" cy="376" r="25"/><circle cx="610" cy="384" r="23"/><circle cx="670" cy="378" r="25"/>
    <circle cx="730" cy="382" r="22"/>
    <rect x="0" y="390" width="800" height="60" fill="#0D111A"/>
  </g>

  <!-- Glassmorphic Tag Badge in Top Left -->
  <g transform="translate(30, 30)">
    <rect width="210" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="22" cy="20" r="6" fill="#34A853"/>
    <text x="36" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">JASHRANG MAIN AUDITORIUM</text>
  </g>
  <!-- Time / Crowd Badge Top Right -->
  <g transform="translate(610, 30)">
    <rect width="160" height="40" rx="20" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)"/>
    <text x="80" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFD166">1,800+ LIVE ATTENDEES</text>
  </g>
</svg>