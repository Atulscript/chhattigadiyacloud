    <circle cx="70" cy="65" r="45" fill="#FFA000" opacity="0.9"/>
    <!-- Child silhouette laughing -->
    <circle cx="50" cy="50" r="14" fill="#FFE082"/>
    <path d="M40,68 C40,85 65,85 65,68 Z" fill="#FFE082"/>
