  <text x="200" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFCA28">ULLAS CAMP SPECIAL</text>
  <text x="365" y="125" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">JUNE 2026</text>
  <line x1="30" y1="133" x2="370" y2="133" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <circle cx="200" cy="260" r="115" fill="url(#c11-sun)"/>
  
  <!-- Playful Clay Mask &amp; Children Shadow Puppet Art -->
  <g transform="translate(130, 185)">
