    <line x1="90" y1="120" x2="110" y2="40" stroke="#FFD54F" stroke-width="3"/>
    <path d="M100,45 L125,35 L120,60 Z" fill="#FF8F00"/>
    <circle cx="112" cy="48" r="3" fill="#FFFFFF"/>
  </g>

  <g transform="translate(30, 360)">
