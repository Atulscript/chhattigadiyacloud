      <stop offset="100%" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#c11-grad)" rx="8"/>
  <rect x="14" y="14" width="372" height="532" rx="4" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
