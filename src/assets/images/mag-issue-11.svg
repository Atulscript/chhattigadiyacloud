      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#271C19"/>
    </linearGradient>
    <radialGradient id="c11-sun" cx="50%" cy="40%" r="50%">
