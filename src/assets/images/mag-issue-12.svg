    <text x="15" y="46" font-family="Georgia, serif" font-size="17" font-weight="800" fill="#FFFFFF">Songs of the Sal Groves</text>
    <text x="15" y="65" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#C8E6C9">Tribal Ballads &amp; Oral Epics of Jashpur</text>
    <text x="15" y="82" font-family="sans-serif" font-size="11" fill="#CBD5E1">Transcribed Verses in Kurukh and Chhattisgarhi</text>
