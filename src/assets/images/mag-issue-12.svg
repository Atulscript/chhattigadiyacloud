  <line x1="30" y1="112" x2="370" y2="112" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="35" y="125" font-family="sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">VOL. IV • ISSUE 07</text>
