  <g transform="translate(30, 468)">
    <text x="0" y="16" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">✦ 18 Rare Kurukh Ballads with Translations</text>
    <text x="0" y="34" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">✦ The Acoustic Architecture of Karma Songs</text>
    <text x="0" y="52" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">✦ Forest Folklore Recorded in Village Choupals</text>
