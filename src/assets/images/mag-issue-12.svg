  <text x="365" y="125" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">JULY 2026</text>
  <line x1="30" y1="133" x2="370" y2="133" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <circle cx="200" cy="260" r="115" fill="url(#c12-forest)"/>
  
  <!-- Stylized Sal Trees &amp; Flute Motif -->
  <g transform="translate(135, 175)">
