      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <radialGradient id="c12-forest" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#81C784" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F2027" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#c12-grad)" rx="8"/>
  <rect x="14" y="14" width="372" height="532" rx="4" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <rect x="14" y="14" width="372" height="6" fill="#34A853" rx="2"/>
