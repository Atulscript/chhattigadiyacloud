    <path d="M40,160 L40,70 L20,30 M40,70 L60,35" stroke="#A5D6A7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="25" r="14" fill="#66BB6A" opacity="0.8"/>
    <circle cx="60" cy="30" r="16" fill="#81C784" opacity="0.8"/>
    <circle cx="40" cy="50" r="20" fill="#4CAF50" opacity="0.9"/>
    
    <path d="M100,160 L100,60 L85,25 M100,60 L115,20" stroke="#C8E6C9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="85" cy="20" r="12" fill="#81C784" opacity="0.75"/>
    <circle cx="115" cy="15" r="14" fill="#A5D6A7" opacity="0.75"/>
    <circle cx="100" cy="40" r="16" fill="#66BB6A" opacity="0.85"/>
    <!-- Bamboo flute diagonally across -->
    <rect x="-10" y="110" width="150" height="9" rx="4" fill="#FFE082" transform="rotate(-15, 65, 115)"/>
    <circle cx="20" cy="120" r="2" fill="#3E2723"/>
    <circle cx="45" cy="115" r="2" fill="#3E2723"/>
    <circle cx="70" cy="110" r="2" fill="#3E2723"/>
    <circle cx="95" cy="105" r="2" fill="#3E2723"/>
