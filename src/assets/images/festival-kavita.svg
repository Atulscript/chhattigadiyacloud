<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="m3KavitaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF7E0"/>
      <stop offset="60%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="m3QuillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>

    <style>
      @keyframes floatQuillClean {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      .clean-quill { transform-origin: 260px 180px; animation: floatQuillClean 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Clean Google Warm Surface -->
  <rect width="800" height="360" fill="url(#m3KavitaBg)"/>

  <!-- Subtle Minimal Ground Line -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#DADCE0" stroke-width="1.5"/>

  <!-- Left: Manuscript Parchment &amp; Modern Feather Quill -->
  <g transform="translate(100, 70)">
    <!-- Parchment Document Card -->
    <rect x="30" y="20" width="200" height="230" rx="16" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(60,64,67,0.08))"/>
    
    <!-- Lyrical Manuscript Lines in Google Blue -->
    <line x1="60" y1="60" x2="180" y2="60" stroke="#1A73E8" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="85" x2="200" y2="85" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="110" x2="190" y2="110" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="135" x2="160" y2="135" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="160" x2="200" y2="160" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="185" x2="140" y2="185" stroke="#E8EAED" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Red Seal Stamp -->
    <circle cx="190" cy="210" r="16" fill="#EA4335"/>
    <circle cx="190" cy="210" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Floating Elegant Quill in Google Red -->
    <g class="clean-quill">
      <path d="M 210,40 C 230,80 225,130 190,180 C 180,165 180,140 185,110 C 175,130 160,140 155,130 C 150,110 170,80 210,40 Z" fill="url(#m3QuillGrad)"/>
      <line x1="210" y1="40" x2="185" y2="185" stroke="#B31412" stroke-width="2"/>
      <circle cx="185" cy="192" r="3.5" fill="#1A73E8"/>
    </g>
  </g>

  <!-- Right: Clean Typography &amp; Informational Tokens -->
  <g transform="translate(430, 110)">
    <!-- Pill Category Chip -->
    <rect width="190" height="28" rx="14" fill="#FEF7E0"/>
    <text x="95" y="18" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="700" font-size="11" fill="#B06000" text-anchor="middle" letter-spacing="0.5">POETRY &amp; BARDIC GATHERING</text>

    <!-- Clean Typography -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="800" font-size="28" fill="#202124" letter-spacing="-0.5">Jaspur Kavita Utsav</text>
    <text x="0" y="94" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="500" font-size="14" fill="#5F6368">National Conclave of Bards, Dialects &amp; Ghazal</text>

    <!-- Key Badges Row -->
    <g transform="translate(0, 115)">
      <rect width="100" height="26" rx="6" fill="#F1F3F4"/>
      <text x="50" y="17" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="600" font-size="11" fill="#3C4043" text-anchor="middle">35+ Poets</text>

      <rect x="108" width="120" height="26" rx="6" fill="#F1F3F4"/>
      <text x="168" y="17" font-family="'Plus Jakarta Sans', Roboto, sans-serif" font-weight="600" font-size="11" fill="#3C4043" text-anchor="middle">Chhattisgarhi &amp; Hindi</text>
    </g>
  </g>
</svg>