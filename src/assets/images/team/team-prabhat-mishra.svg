  <rect x="166" y="140" width="22" height="18" rx="5" fill="rgba(255,255,255,0.2)" stroke="#C7D2FE" stroke-width="2"/>
  <line x1="154" y1="149" x2="166" y2="149" stroke="#C7D2FE" stroke-width="2"/>

  <!-- Eyes & Eyebrows -->
  <path d="M134 135 Q143 130 152 135" fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M168 135 Q177 130 186 135" fill="none" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="143" cy="149" r="3.5" fill="#1C1917"/>
  <circle cx="177" cy="149" r="3.5" fill="#1C1917"/>

