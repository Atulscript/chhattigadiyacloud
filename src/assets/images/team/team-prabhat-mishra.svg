  <rect x="146" y="195" width="28" height="40" rx="4" fill="url(#skin-prabhat)"/>
  <!-- Head -->
  <ellipse cx="160" cy="155" rx="44" ry="52" fill="url(#skin-prabhat)"/>
  <ellipse cx="116" cy="155" rx="7" ry="12" fill="url(#skin-prabhat)"/>
  <ellipse cx="204" cy="155" rx="7" ry="12" fill="url(#skin-prabhat)"/>

  <!-- Scholar Hair & Specs -->
  <path d="M116 145 C115 105 130 85 160 85 C190 85 205 105 204 145 C198 115 180 100 160 100 C140 100 122 115 116 145 Z" fill="#1C1917"/>

