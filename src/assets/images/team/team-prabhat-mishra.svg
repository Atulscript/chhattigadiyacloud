      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="skin-prabhat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE9F72"/>
      <stop offset="100%" stop-color="#BA7746"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="20" fill="url(#bg-prabhat)"/>
  <circle cx="160" cy="160" r="135" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="5,5"/>
  <circle cx="160" cy="140" r="95" fill="rgba(255,255,255,0.08)"/>

  <!-- Body / Scholar Kurta -->
  <path d="M85 320 C85 255 115 225 160 225 C205 225 235 255 235 320 Z" fill="#EEF2FF"/>
  <path d="M140 230 L160 280 L180 230" fill="#4F46E5" opacity="0.6"/>

