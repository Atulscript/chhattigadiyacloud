  <path d="M160 152 L157 167 L164 167" fill="none" stroke="#3730A3" stroke-width="2" stroke-linecap="round"/>
  <path d="M152 180 Q160 186 168 180" fill="none" stroke="#3730A3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Corner Manuscript / Archive Motif -->
  <circle cx="265" cy="265" r="24" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="265" y="272" font-size="20" text-anchor="middle">📜</text>
