  <path d="M166 138 Q174 130 185 138" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="145" cy="146" r="4.5" fill="#18181B"/>
  <circle cx="175" cy="146" r="4.5" fill="#18181B"/>
  <path d="M160 146 L157 165 L164 165" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 178 Q160 185 170 178" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>

