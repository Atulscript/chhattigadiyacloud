      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="skin-tushar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DE9F72"/>
