  <ellipse cx="160" cy="155" rx="44" ry="52" fill="url(#skin-tushar)"/>
  <ellipse cx="116" cy="155" rx="7" ry="12" fill="url(#skin-tushar)"/>
  <ellipse cx="204" cy="155" rx="7" ry="12" fill="url(#skin-tushar)"/>

