<!DOCTYPE html>
<!--
  ART BANNER — animated decorative strip (theatre & arts), self-contained.

  HOW TO EMBED
  1. Copy the <style id="ab-style"> block into your page <head> (or stylesheet).
  2. Copy the <div class="art-banner"> ... </div> block where the strip should appear.
  3. Copy the <script id="ab-script"> block before </body>.
  Everything is prefixed "ab-" / "art-banner", so it will not clash with your CSS.
  Height: 140px on desktop, 100px below 768px. It fills 100% of its container width.
  Options (attributes on .art-banner):  data-hover-pause="true" pauses on hover.
  Motion pauses automatically when off-screen, and is fully static when the visitor
  prefers reduced motion. The banner is decorative: aria-hidden + role="presentation".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art banner — demo</title>
<style>
  /* Demo page only (not needed when embedding) */
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fbf6ef; color: #3a2a20; }
  .demo { max-width: 1200px; margin: 40px auto; padding: 0 16px; }
  .demo p { margin: 12px 0 24px; color: #7a6450; }
</style>

<style id="ab-style">
.art-banner {
  --ab-h: 140px; --ab-med: 110px; --ab-val: 26px;
  --ab-v: #E8401C; --ab-o: #F26A2E; --ab-g: #F5B82E; --ab-p: #F8CFC0; --ab-m: #8A1E0E; --ab-c: #FFF7F2;
  position: relative; width: 100%; height: var(--ab-h); overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, #FFF7F2 0%, #FDEBE3 100%);
  contain: layout paint;
}
@media (max-width: 767px) { .art-banner { --ab-h: 100px; --ab-med: 80px; --ab-val: 18px; } }
.art-banner * { box-sizing: border-box; }
.art-banner svg { display: block; overflow: visible; }
.art-banner svg * { transform-box: view-box; }

/* Layers */
.ab-layer { position: absolute; inset: 0; }
.ab-track { display: flex; width: max-content; height: 100%; will-change: transform; }
.ab-tile { flex: none; height: var(--ab-h); }
.ab-back { opacity: .6; filter: blur(1.2px); }
.ab-back .ab-tile { width: calc(var(--ab-h) * 14.2857); }
.ab-mid .ab-tile { width: calc(var(--ab-h) * 11.4286); }
.art-banner.ab-js .ab-back .ab-track { animation: ab-scroll-b 60s linear infinite; }
.art-banner.ab-js .ab-mid .ab-track { animation: ab-scroll-m 35s linear infinite; }
@keyframes ab-scroll-b { to { transform: translateX(calc(var(--ab-h) * -14.2857)); } }
@keyframes ab-scroll-m { to { transform: translateX(calc(var(--ab-h) * -11.4286)); } }
.ab-pe { fill: var(--ab-p); }
.ab-ps { fill: none; stroke: var(--ab-p); stroke-linecap: round; stroke-linejoin: round; }

/* Floating notes & paint dots */
.ab-float { position: absolute; width: 12px; height: 14px; opacity: 0; animation: ab-rise 9s ease-in-out infinite; }
@keyframes ab-rise { 0% { opacity: 0; transform: translateY(12px); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-46px); } }

/* Figures */
.ab-l { fill: none; stroke: var(--ab-v); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.ab-f { fill: var(--ab-v); }
.ab-t { fill: none; stroke: var(--ab-m); stroke-width: 3; stroke-linecap: round; }

/* 1 mime */
.ab-mime { transform-origin: 90px 133px; animation: ab-lean 2.8s ease-in-out infinite alternate; }
.ab-push { animation: ab-push 2.8s ease-in-out infinite alternate; }
.ab-wall { animation: ab-wall 2.8s ease-in-out infinite alternate; opacity: 0; }
@keyframes ab-lean { to { transform: rotate(4deg); } }
@keyframes ab-push { 0%, 30% { transform: translateX(0); } 100% { transform: translateX(3px); } }
@keyframes ab-wall { 0%, 60% { opacity: 0; } 100% { opacity: .8; } }
/* 2 painter */
.ab-brush { transform-origin: 71px 82px; animation: ab-brush 1.7s ease-in-out infinite alternate; }
.ab-arc { transform-origin: 117px 80px; animation: ab-arc 6.8s ease-in-out infinite; }
@keyframes ab-brush { from { transform: rotate(-10deg); } to { transform: rotate(9deg); } }
@keyframes ab-arc { 0% { transform: scaleX(0); opacity: 1; } 45% { transform: scaleX(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
/* 3 actors */
.ab-kneel { animation: ab-bob 4.2s ease-in-out infinite alternate; }
.ab-grief { transform-origin: 146px 104px; animation: ab-grief 5.4s ease-in-out infinite alternate; }
@keyframes ab-bob { to { transform: translateY(-2px); } }
@keyframes ab-grief { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
/* 4 dancer */
.ab-spin { transform-origin: 100px 100px; animation: ab-spin 3.2s ease-in-out infinite alternate; }
.ab-skirt { transform-origin: 100px 98px; animation: ab-flare 1.6s ease-in-out infinite alternate; }
.ab-orbit { transform-origin: 0 0; animation: ab-orbit 3.2s linear infinite; }
@keyframes ab-spin { 0%, 15% { transform: scaleX(1); } 85%, 100% { transform: scaleX(-1); } }
@keyframes ab-flare { from { transform: scaleX(.92); } to { transform: scaleX(1.28); } }
@keyframes ab-orbit { to { transform: rotate(360deg); } }
/* 5 puppeteer */
.ab-bar { transform-origin: 112px 50px; animation: ab-tilt 2.6s ease-in-out infinite alternate; }
.ab-pup { animation: ab-hop .9s ease-in-out infinite alternate; }
.ab-parm { transform-origin: 124px 99px; animation: ab-jig .45s ease-in-out infinite alternate; }
.ab-pleg { transform-origin: 124px 112px; animation: ab-jig .6s ease-in-out infinite alternate-reverse; }
@keyframes ab-tilt { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes ab-hop { to { transform: translateY(-4px); } }
@keyframes ab-jig { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
/* 6 director */
.ab-clap { transform-origin: 106px 79px; animation: ab-clap 3s ease-in-out infinite; }
.ab-burst { opacity: 0; animation: ab-burst 3s ease-out infinite; }
@keyframes ab-clap { 0%, 74% { transform: rotate(-30deg); } 80%, 90% { transform: rotate(0); } 100% { transform: rotate(-30deg); } }
@keyframes ab-burst { 0%, 78% { opacity: 0; transform: scale(.8); } 83% { opacity: 1; } 96%, 100% { opacity: 0; transform: scale(1.1); } }
.ab-burst { transform-origin: 134px 76px; }
/* 7 sculptor */
.ab-mallet { transform-origin: 70px 84px; animation: ab-tap 1.3s ease-in infinite; }
.ab-chip { opacity: 0; transform-origin: 112px 92px; animation: ab-chip 1.3s ease-out infinite; }
.ab-chip:nth-child(2) { animation-name: ab-chip2; }
.ab-chip:nth-child(3) { animation-name: ab-chip3; }
@keyframes ab-tap { 0%, 55% { transform: rotate(-28deg); } 72% { transform: rotate(4deg); } 100% { transform: rotate(-28deg); } }
@keyframes ab-chip { 0%, 70% { opacity: 0; transform: translate(0, 0); } 74% { opacity: 1; } 100% { opacity: 0; transform: translate(12px, -14px); } }
@keyframes ab-chip2 { 0%, 70% { opacity: 0; transform: translate(0, 0); } 74% { opacity: 1; } 100% { opacity: 0; transform: translate(16px, -4px); } }
@keyframes ab-chip3 { 0%, 70% { opacity: 0; transform: translate(0, 0); } 74% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -20px); } }
/* 8 musician */
.ab-hl { transform-origin: 90px 82px; animation: ab-hitl 1.2s ease-in-out infinite; }
.ab-hr { transform-origin: 90px 82px; animation: ab-hitr 1.2s ease-in-out infinite; animation-delay: -.6s; }
.ab-ring { opacity: 0; animation: ab-ring 1.2s ease-out infinite; }
.ab-ring--r { animation-delay: -.6s; }
@keyframes ab-hitl { 0%, 100% { transform: rotate(10deg); } 40% { transform: rotate(-6deg); } }
@keyframes ab-hitr { 0%, 100% { transform: rotate(-10deg); } 40% { transform: rotate(6deg); } }
@keyframes ab-ring { 0%, 35% { opacity: 0; transform: scale(.4); } 42% { opacity: .9; } 100% { opacity: 0; transform: scale(1.7); } }
.ab-ring--l { transform-origin: 72px 101px; }
.ab-ring--r { transform-origin: 110px 101px; }

/* Spotlight + medallion (fixed centre) */
.ab-spot {
  position: absolute; left: 50%; top: calc(var(--ab-val) - 4px); width: calc(var(--ab-med) * 2); height: calc(50% - var(--ab-val) / 2 + 4px);
  transform: translateX(-50%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, rgba(245, 184, 46, .5), rgba(245, 184, 46, 0));
  animation: ab-spot 6s ease-in-out infinite alternate; pointer-events: none;
}
@keyframes ab-spot { from { opacity: .35; } to { opacity: .8; } }
.ab-med {
  position: absolute; left: 50%; top: calc(50% + var(--ab-val) / 2 - 3px); width: var(--ab-med); height: var(--ab-med);
  transform: translate(-50%, -50%); filter: drop-shadow(0 4px 10px rgba(138, 30, 14, .18));
}
.ab-med svg { width: 100%; height: 100%; }
.ab-ring2 { transform-origin: 60px 60px; animation: ab-orbit 20s linear infinite; }
.ab-mask { animation: ab-speak 8s ease-in-out infinite; }
.ab-mask--t { animation-delay: -4s; }
.ab-glow { opacity: 0; animation: ab-glow 8s ease-in-out infinite; }
.ab-glow--t { animation-delay: -4s; }
@keyframes ab-speak { 0%, 44% { transform: scale(1.08) rotate(-5deg) translateY(-1.5px); opacity: 1; } 52%, 94% { transform: scale(.94); opacity: .55; } 100% { transform: scale(1.08) rotate(-5deg) translateY(-1.5px); opacity: 1; } }
@keyframes ab-glow { 0%, 44% { opacity: .85; } 52%, 94% { opacity: 0; } 100% { opacity: .85; } }

/* Valance (top) */
.ab-val { position: absolute; left: 0; right: 0; top: 0; height: var(--ab-val); z-index: 4; }
.ab-val svg { width: 100%; height: 100%; }
.ab-sway { transform-box: fill-box; transform-origin: 50% 0; animation: ab-sway 5s ease-in-out infinite alternate; }
.ab-sway--back { animation-duration: 6s; animation-delay: -2s; }
@keyframes ab-sway { from { transform: translateX(-5px) skewX(-2deg); } to { transform: translateX(5px) skewX(2deg); } }

/* Stage floor + footlights (bottom) */
.ab-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--ab-v); z-index: 4; }
.ab-lights { position: absolute; left: 0; right: 0; bottom: 1px; height: 4px; display: flex; justify-content: space-around; z-index: 5; }
.ab-dot {
  width: 4px; height: 4px; border-radius: 50%; background: var(--ab-g); opacity: .4;
  box-shadow: 0 0 6px 2px rgba(245, 184, 46, .8);
  animation: ab-twinkle 3s ease-in-out infinite; animation-delay: calc(var(--i) * .15s);
}
@keyframes ab-twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 15% { opacity: 1; transform: scale(1.25); } 30% { opacity: .35; transform: scale(.8); } }

/* Pausing: off-screen (automatic) and on hover (opt-in) */
.art-banner.ab-paused *, .art-banner.ab-paused .ab-track { animation-play-state: paused !important; }
/* Reduced motion: a still, composed scene */
@media (prefers-reduced-motion: reduce) {
  .art-banner *, .art-banner.ab-js .ab-track { animation: none !important; }
  .ab-float { opacity: .35; }
}
</style>
</head>
<body>
<div class="demo">
  <h1>Art banner — preview</h1>
  <p>Resize the window to see the mobile height (under 768px). Hover the strip to pause it (data-hover-pause="true").</p>

<div class="art-banner" aria-hidden="true" role="presentation" data-hover-pause="true">
  <svg width="0" height="0" style="position:absolute" focusable="false">
    <defs>
      <pattern id="ab-drape" width="56" height="26" patternUnits="userSpaceOnUse">
        <path d="M0 0H56V9Q46 25 28 25Q10 25 0 9Z" fill="#E8401C"/>
        <path d="M0 9Q10 25 28 25Q46 25 56 9" fill="none" stroke="#F5B82E" stroke-width="1.6"/>
        <path d="M28 3V20" stroke="#8A1E0E" stroke-width="1" opacity=".35"/>
      </pattern>
      <pattern id="ab-drape2" width="56" height="26" x="28" patternUnits="userSpaceOnUse">
        <path d="M0 0H56V9Q46 22 28 22Q10 22 0 9Z" fill="#8A1E0E"/>
      </pattern>
      <filter id="ab-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
  </svg>

  <!-- Background: peach silhouettes (slow parallax) -->
  <div class="ab-layer ab-back"><div class="ab-track">
    <svg class="ab-tile" viewBox="0 0 2000 140" preserveAspectRatio="xMinYMid meet">
      <!-- proscenium arch -->
      <path class="ab-ps" stroke-width="14" d="M90 140V72Q210 22 330 72V140"/>
      <path class="ab-ps" stroke-width="5" d="M118 140V84Q210 46 302 84V140"/>
      <!-- easel + canvas -->
      <path class="ab-ps" stroke-width="7" d="M520 140L560 44L600 140M560 44V140"/>
      <rect class="ab-pe" x="524" y="54" width="72" height="54" rx="3"/>
      <!-- film camera on tripod -->
      <path class="ab-ps" stroke-width="6" d="M900 96L866 140M900 96L934 140M900 96V140"/>
      <rect class="ab-pe" x="866" y="64" width="64" height="34" rx="5"/>
      <circle class="ab-pe" cx="880" cy="50" r="15"/><circle class="ab-pe" cx="914" cy="48" r="17"/>
      <path class="ab-pe" d="M930 72L956 62V100L930 90Z"/>
      <!-- paint palette -->
      <path class="ab-pe" d="M1250 80C1250 54 1286 42 1320 48C1352 54 1366 76 1352 92C1342 102 1326 94 1318 104C1310 116 1318 128 1296 130C1266 132 1250 106 1250 80Z"/>
      <g fill="#FDEBE3"><circle cx="1280" cy="68" r="6"/><circle cx="1302" cy="60" r="6"/><circle cx="1326" cy="66" r="6"/><circle cx="1296" cy="112" r="7"/></g>
      <!-- spotlight tower -->
      <path class="ab-ps" stroke-width="5" d="M1640 140V40M1672 140V40M1640 60L1672 80M1672 60L1640 80M1640 90L1672 110M1672 90L1640 110M1640 120L1672 140"/>
      <path class="ab-pe" d="M1632 30H1680V44H1632Z"/>
      <path class="ab-pe" d="M1680 32L1720 20V54L1680 42Z"/>
    </svg>
  </div></div>

  <!-- Floating notes and paint dots -->
  <svg class="ab-float" style="left:8%;bottom:30%;animation-delay:-1s" viewBox="0 0 12 14"><path d="M4 11a3 2.4 0 1 1 0-.1V1l7 2v3L6 4.5" fill="#F26A2E"/></svg>
  <svg class="ab-float" style="left:21%;bottom:42%;animation-duration:11s;animation-delay:-6s" viewBox="0 0 12 14"><circle cx="6" cy="7" r="3" fill="#F5B82E"/></svg>
  <svg class="ab-float" style="left:33%;bottom:26%;animation-duration:10s;animation-delay:-3s" viewBox="0 0 12 14"><path d="M4 11a3 2.4 0 1 1 0-.1V1l7 2v3L6 4.5" fill="#F5B82E"/></svg>
  <svg class="ab-float" style="left:61%;bottom:38%;animation-duration:12s;animation-delay:-8s" viewBox="0 0 12 14"><circle cx="6" cy="7" r="2.4" fill="#E8401C"/></svg>
  <svg class="ab-float" style="left:72%;bottom:28%;animation-delay:-4s" viewBox="0 0 12 14"><path d="M4 11a3 2.4 0 1 1 0-.1V1l7 2v3L6 4.5" fill="#E8401C"/></svg>
  <svg class="ab-float" style="left:84%;bottom:44%;animation-duration:10s;animation-delay:-2s" viewBox="0 0 12 14"><circle cx="6" cy="7" r="3" fill="#F26A2E"/></svg>
  <svg class="ab-float" style="left:94%;bottom:32%;animation-duration:11s;animation-delay:-7s" viewBox="0 0 12 14"><path d="M4 11a3 2.4 0 1 1 0-.1V1l7 2v3L6 4.5" fill="#F26A2E"/></svg>

  <!-- Midground: eight performers (one tile, cloned by the script for a seamless loop) -->
  <div class="ab-layer ab-mid"><div class="ab-track">
    <svg class="ab-tile" viewBox="0 0 1600 140" preserveAspectRatio="xMinYMid meet">
      <!-- 1 Mime pushing an invisible wall -->
      <svg x="0" width="200" height="140" viewBox="0 0 200 140">
        <g class="ab-mime">
          <path class="ab-l" d="M82 133L90 104L98 133M90 104L91 78"/>
          <circle class="ab-f" cx="92" cy="68" r="8.5"/>
          <g class="ab-push">
            <path class="ab-l" d="M91 81L107 79L120 76M91 86L106 90L120 92"/>
            <rect class="ab-f" x="119" y="67" width="5" height="14" rx="2"/><rect class="ab-f" x="119" y="84" width="5" height="14" rx="2"/>
          </g>
        </g>
        <g class="ab-wall" fill="#F5B82E"><circle cx="130" cy="66" r="1.6"/><circle cx="130" cy="82" r="1.6"/><circle cx="130" cy="98" r="1.6"/></g>
      </svg>
      <!-- 2 Painter at an easel -->
      <svg x="200" width="200" height="140" viewBox="0 0 200 140">
        <path class="ab-t" d="M118 133L132 64L146 133M132 64V133"/>
        <rect x="111" y="58" width="44" height="36" rx="2" fill="#FFF7F2" stroke="#F26A2E" stroke-width="2.5"/>
        <path class="ab-arc" d="M117 86Q133 60 149 82" fill="none" stroke="#F5B82E" stroke-width="3.5" stroke-linecap="round"/>
        <path class="ab-l" d="M62 133L70 104L78 133M70 104L71 78M71 84L60 94L54 88"/>
        <ellipse cx="50" cy="89" rx="7" ry="4.5" fill="#F5B82E"/>
        <circle class="ab-f" cx="72" cy="68" r="8.5"/>
        <g class="ab-brush"><path class="ab-l" d="M71 82L88 78L103 74"/><path class="ab-t" d="M103 74L113 70"/></g>
      </svg>
      <!-- 3 Two actors in a dramatic pose -->
      <svg x="400" width="200" height="140" viewBox="0 0 200 140">
        <g class="ab-kneel">
          <path class="ab-l" d="M72 108L88 110L90 133M72 108L64 124L48 131M72 108L76 84"/>
          <circle class="ab-f" cx="80" cy="74" r="8.5"/>
          <path class="ab-l" d="M76 88L97 81L116 75M76 90L68 100L66 110"/>
        </g>
        <g class="ab-grief">
          <path class="ab-l" d="M138 133L146 104L154 133M146 104L144 78"/>
          <circle class="ab-f" cx="141" cy="68" r="8.5"/>
          <path class="ab-l" d="M144 82L131 78L136 66M144 84L157 96L162 108"/>
        </g>
      </svg>
      <!-- 4 Classical dancer spinning -->
      <svg x="600" width="200" height="140" viewBox="0 0 200 140">
        <g transform="translate(100 114) scale(1 .28)"><g class="ab-orbit" fill="#F5B82E">
          <circle cx="34" cy="0" r="3.2"/><circle cx="24" cy="24" r="2.8" opacity=".8"/><circle cx="0" cy="34" r="2.4" opacity=".6"/><circle cx="-24" cy="24" r="2" opacity=".45"/><circle cx="-34" cy="0" r="1.6" opacity=".3"/>
        </g></g>
        <g class="ab-spin">
          <path class="ab-l" d="M96 124L94 133M104 124L106 133" stroke-width="6"/>
          <path class="ab-skirt ab-f" d="M92 97H108L124 124Q100 132 76 124Z"/>
          <path class="ab-l" d="M100 100V77M100 80L86 70L80 56M100 80L115 86L128 80"/>
          <circle class="ab-f" cx="100" cy="67" r="8.5"/>
        </g>
      </svg>
      <!-- 5 Puppeteer and marionette -->
      <svg x="800" width="200" height="140" viewBox="0 0 200 140">
        <path class="ab-l" d="M62 133L70 104L78 133M70 104L71 78M71 82L88 66L100 54"/>
        <circle class="ab-f" cx="71" cy="68" r="8.5"/>
        <g class="ab-bar">
          <path class="ab-t" d="M96 50H128" stroke-width="4"/>
          <path d="M100 50L116 100M112 50L124 86M128 50L132 100" stroke="#8A1E0E" stroke-width=".9" fill="none"/>
          <g class="ab-pup">
            <circle cx="124" cy="92" r="5" fill="#F26A2E"/>
            <path class="ab-l" d="M124 97V112" stroke="#F26A2E" stroke-width="4"/>
            <path class="ab-parm ab-l" d="M116 104L124 99L132 104" stroke="#F26A2E" stroke-width="3.5"/>
            <path class="ab-pleg ab-l" d="M119 124L124 112L129 124" stroke="#F26A2E" stroke-width="3.5"/>
          </g>
        </g>
      </svg>
      <!-- 6 Director with a clapperboard -->
      <svg x="1000" width="200" height="140" viewBox="0 0 200 140">
        <path class="ab-l" d="M72 133L80 104L88 133M80 104L81 78M81 86L70 94L78 101M81 84L95 90L106 88"/>
        <circle class="ab-f" cx="82" cy="68" r="8.5"/>
        <path d="M73 61Q82 54 91 61Z" fill="#8A1E0E"/>
        <rect x="106" y="80" width="27" height="19" rx="2" fill="#8A1E0E"/>
        <path d="M110 86H129M110 92H129" stroke="#F5B82E" stroke-width="1.4" opacity=".7"/>
        <g class="ab-clap"><rect x="106" y="74" width="27" height="5" rx="1" fill="#F5B82E"/><path d="M112 74L109 79M119 74L116 79M126 74L123 79" stroke="#8A1E0E" stroke-width="1.5"/></g>
        <g class="ab-burst" stroke="#F5B82E" stroke-width="2" stroke-linecap="round"><path d="M138 70L144 64M140 77L148 76M136 64L138 57M130 66L128 59"/></g>
      </svg>
      <!-- 7 Sculptor with chisel and mallet -->
      <svg x="1200" width="200" height="140" viewBox="0 0 200 140">
        <rect x="110" y="96" width="34" height="37" rx="3" fill="#F26A2E"/>
        <path d="M117 96Q118 80 127 78Q136 80 137 96Z" fill="#F26A2E"/>
        <circle cx="127" cy="74" r="7" fill="#F26A2E"/>
        <path class="ab-l" d="M58 133L66 104L74 133M66 104L70 80M70 88L88 94L104 96"/>
        <path class="ab-t" d="M104 96L114 92"/>
        <circle class="ab-f" cx="73" cy="70" r="8.5"/>
        <g class="ab-mallet"><path class="ab-l" d="M70 84L84 76L96 80"/><rect x="94" y="73" width="11" height="9" rx="2" fill="#8A1E0E"/></g>
        <g fill="#F5B82E"><rect class="ab-chip" x="112" y="90" width="3" height="3"/><rect class="ab-chip" x="113" y="92" width="2.5" height="2.5"/><rect class="ab-chip" x="111" y="89" width="2.5" height="2.5"/></g>
      </svg>
      <!-- 8 Musician playing a dhol -->
      <svg x="1400" width="200" height="140" viewBox="0 0 200 140">
        <path class="ab-l" d="M82 133L90 104L98 133M90 104L90 78"/>
        <circle class="ab-f" cx="90" cy="68" r="8.5"/>
        <path d="M84 80L106 94" stroke="#8A1E0E" stroke-width="2"/>
        <rect x="74" y="92" width="34" height="18" rx="4" fill="#F26A2E"/>
        <path d="M78 94L84 108L90 94L96 108L102 94" fill="none" stroke="#8A1E0E" stroke-width="1.4"/>

        <circle class="ab-ring ab-ring--l" cx="72" cy="101" r="8" fill="none" stroke="#F5B82E" stroke-width="1.6"/>

  <!-- Spotlight and centre medallion (fixed) -->
  <div class="ab-spot"></div>
  <div class="ab-med">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="59" fill="#FFF7F2"/>
      <circle cx="60" cy="60" r="56" fill="none" stroke="#F5B82E" stroke-width="6" stroke-dasharray="2 9.7"/>
      <circle class="ab-ring2" cx="60" cy="60" r="49" fill="none" stroke="#F5B82E" stroke-width="3" stroke-linecap="round" stroke-dasharray=".1 6.4"/>
      <circle cx="60" cy="60" r="43" fill="#FFF7F2" stroke="#F26A2E" stroke-width="1.5"/>
      <!-- comedy -->
      <g transform="translate(50 58) rotate(-10)">
        <circle class="ab-glow" r="18" fill="#F5B82E" filter="url(#ab-soft)"/>
        <g class="ab-mask">
          <path d="M-15-16Q0-22 15-16Q17 4 0 20Q-17 4-15-16Z" fill="#E8401C"/>
          <path d="M-10-7Q-6-12-2-7Q-6-4-10-7ZM2-7Q6-12 10-7Q6-4 2-7Z" fill="#FFF7F2"/>
          <path d="M-8 3Q0 13 8 3Q0 8-8 3Z" fill="#FFF7F2"/>
        </g>
      </g>
      <!-- tragedy -->
      <g transform="translate(71 63) rotate(12)">
        <circle class="ab-glow ab-glow--t" r="18" fill="#F5B82E" filter="url(#ab-soft)"/>

    <svg preserveAspectRatio="none" viewBox="0 0 100 26" width="100%" height="100%">
      <g class="ab-sway ab-sway--back"><rect x="-10" y="0" width="120" height="26" fill="url(#ab-drape2)" transform="scale(.01 1)" opacity=".6"/></g>

  <p>Drop the <code>.art-banner</code> block, the <code>#ab-style</code> styles and the <code>#ab-script</code> script into any page.</p>
</div>

<script id="ab-script">
(function () {
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  [].forEach.call(document.querySelectorAll('.art-banner'), function (root) {
    // Valance: build the drape row in real pixels so scallops keep their shape at any width.
    var val = root.querySelector('.ab-val svg');
    function buildValance() {
      var w = root.clientWidth, h = root.querySelector('.ab-val').clientHeight || 26;
      val.setAttribute('viewBox', '0 0 ' + w + ' 26');
      val.setAttribute('preserveAspectRatio', 'none');
      val.innerHTML =
        '<g class="ab-sway ab-sway--back"><rect x="-40" y="0" width="' + (w + 80) + '" height="26" fill="url(#ab-drape2)" opacity=".7"/></g>' +
        '<g class="ab-sway"><rect x="-40" y="0" width="' + (w + 80) + '" height="26" fill="url(#ab-drape)"/></g>' +
        '<rect x="0" y="0" width="' + w + '" height="5" fill="#E8401C"/><rect x="0" y="5" width="' + w + '" height="1.2" fill="#F5B82E"/>';
    }
    // Footlights: one dot every ~34px; the chase runs through them in order.
    var lights = root.querySelector('.ab-lights');
    function buildLights() {
      var n = Math.max(8, Math.round(root.clientWidth / 34));
      var html = '';
      for (var i = 0; i < n; i++) html += '<span class="ab-dot" style="--i:' + i + '"></span>';
      lights.innerHTML = html;
    }
    // Scrolling tracks: repeat the tile until it covers the width twice over.
    function fillTracks() {
      [].forEach.call(root.querySelectorAll('.ab-track'), function (track) {
        var tile = track.firstElementChild;
        while (track.children.length > 1) track.removeChild(track.lastElementChild);
        var tw = tile.getBoundingClientRect().width || 1;
        var need = Math.ceil(root.clientWidth / tw) + 1;
        for (var i = 0; i < need; i++) track.appendChild(tile.cloneNode(true));
      });
    }
    function build() { buildValance(); buildLights(); fillTracks(); }
    build();
    var t;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(build, 150); });
    if (reduce) return;
    root.classList.add('ab-js');
    // Pause while off-screen.
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { root.classList.toggle('ab-off', !e.isIntersecting); sync(); });
      }).observe(root);
    }
    var hover = false;
    if (root.getAttribute('data-hover-pause') === 'true') {
      root.addEventListener('mouseenter', function () { hover = true; sync(); });
      root.addEventListener('mouseleave', function () { hover = false; sync(); });
    }
    function sync() { root.classList.toggle('ab-paused', hover || root.classList.contains('ab-off')); }
  });
})();
</script>
